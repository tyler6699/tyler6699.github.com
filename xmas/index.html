<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advent Run Calendar 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #b3202a;
    --red-dark: #7d1219;
    --green: #0f4d2e;
    --green-dark: #08311d;
    --gold: #e8b74a;
    --cream: #fff8ec;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--cream);
    background:
      radial-gradient(ellipse at top, #1d6b43 0%, var(--green) 45%, var(--green-dark) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  /* Snow */
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

  header {
    position: relative; z-index: 1;
    text-align: center;
    padding: 28px 16px 8px;
  }
  h1 {
    font-family: 'Mountains of Christmas', cursive;
    font-size: clamp(2.2rem, 6vw, 4rem);
    margin: 0;
    color: var(--gold);
    text-shadow: 0 3px 0 var(--red-dark), 0 6px 18px rgba(0,0,0,.4);
  }
  .sub { margin: 6px 0 0; opacity: .9; }
  .toolbar {
    display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    margin: 16px 0 4px;
  }
  .chip {
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    padding: 6px 14px; border-radius: 999px; font-size: .9rem;
  }
  button {
    font-family: inherit; font-weight: 700; cursor: pointer;
    border: none; border-radius: 999px; padding: 8px 16px;
    background: var(--red); color: #fff;
    box-shadow: 0 3px 0 var(--red-dark);
    transition: transform .1s;
  }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--red-dark); }
  button.ghost { background: rgba(255,255,255,.15); box-shadow: none; }

  main { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
  }
  .door-wrap {
    perspective: 900px;
    aspect-ratio: 1 / 1.1;
  }
  .door-wrap.big { grid-column: span 2; aspect-ratio: auto; }
  .door-back {
    position: absolute; inset: 0; z-index: 1;
    border-radius: 12px;
    background: var(--cream); color: var(--green-dark);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 8px;
    box-shadow: inset 0 0 0 3px var(--gold), inset 0 0 22px rgba(0,0,0,.15);
  }
  .door-back .dist { font-size: 1.9rem; font-weight: 800; color: var(--red); line-height: 1; }
  .door-back .unit { font-size: .9rem; font-weight: 700; }
  .door-back .dlabel { font-size: .75rem; opacity: .7; margin-top: 6px; }
  .door-back .ico { font-size: 1.6rem; margin-bottom: 4px; }
  .door {
    position: relative; width: 100%; height: 100%;
  }
  .door-front {
    position: absolute; inset: 0;
    border-radius: 12px;
    z-index: 2;
    transform-origin: left center;
    transition: transform .9s cubic-bezier(.3,.7,.3,1);
    backface-visibility: hidden;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Mountains of Christmas', cursive;
    font-size: 3rem; color: var(--gold);
    text-shadow: 0 2px 0 rgba(0,0,0,.4);
    border: 3px dashed rgba(232,183,74,.55);
    box-shadow: 0 6px 14px rgba(0,0,0,.35);
    user-select: none;
  }
  .door-front::after {
    content: ''; position: absolute; right: 10px; top: 50%;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 4px rgba(0,0,0,.5);
  }
  .door-front.c0 { background: linear-gradient(135deg, #c62a35, #8e1820); }
  .door-front.c1 { background: linear-gradient(135deg, #1b7a49, #0d4529); }
  .door-front.c2 { background: linear-gradient(135deg, #234c8a, #142c55); }
  .door-front.c3 { background: linear-gradient(135deg, #8a5a1f, #5a3912); }
  .door-front .lock {
    position: absolute; bottom: 8px; left: 0; right: 0;
    font-family: 'Nunito', sans-serif; font-size: .7rem;
    text-align: center; opacity: .75; color: #fff; text-shadow: none;
  }
  .door.open .door-front { transform: rotateY(-105deg); pointer-events: none; }
  .door.locked .door-front { filter: saturate(.75) brightness(.85); }
  .shake { animation: shake .45s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-6px) rotate(-2deg); }
    40% { transform: translateX(6px) rotate(2deg); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .summary {
    margin: 22px auto 0; text-align: center;
    background: rgba(0,0,0,.2); border-radius: 14px; padding: 12px;
    max-width: 520px;
  }
  .summary strong { color: var(--gold); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(4, 20, 12, .75);
    display: none; align-items: center; justify-content: center; padding: 16px;
    backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--cream); color: var(--green-dark);
    border-radius: 18px; padding: 24px; width: 100%; max-width: 380px;
    box-shadow: 0 0 0 6px var(--red), 0 0 0 10px var(--gold), 0 20px 50px rgba(0,0,0,.5);
  }
  .modal h2 {
    font-family: 'Mountains of Christmas', cursive; color: var(--red);
    margin: 0 0 6px; font-size: 2rem; text-align: center;
  }
  .modal p { margin: 0 0 16px; text-align: center; font-size: .95rem; }
  .seg { display: flex; background: #eadfca; border-radius: 999px; padding: 4px; margin-bottom: 16px; }
  .seg button {
    flex: 1; background: transparent; color: var(--green-dark); box-shadow: none;
  }
  .seg button.active { background: var(--green); color: #fff; }
  .field { display: flex; gap: 12px; margin-bottom: 12px; }
  .field label { flex: 1; font-weight: 700; font-size: .85rem; }
  .field input {
    width: 100%; margin-top: 4px; padding: 10px; font-size: 1.1rem;
    border: 2px solid #d7c7a8; border-radius: 10px; font-family: inherit;
  }
  .err { color: var(--red); font-size: .85rem; min-height: 1.2em; text-align: center; margin-bottom: 8px; }
  .modal .actions { display: flex; gap: 8px; }
  .modal .actions button { flex: 1; padding: 12px; }
  .modal .actions .ghost { background: #eadfca; color: var(--green-dark); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120%);
    background: var(--red); color: #fff; padding: 12px 20px; border-radius: 12px;
    z-index: 20; transition: transform .3s; box-shadow: 0 6px 20px rgba(0,0,0,.4);
    font-weight: 700; text-align: center; max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<canvas id="snow"></canvas>

<header>
  <h1>Advent Run Calendar</h1>
  <p class="sub" id="countdown"></p>
  <div class="toolbar">
    <span class="chip" id="rangeChip"></span>
    <button class="ghost" id="settingsBtn">Change distances</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="summary" id="summary"></div>
</main>

<div class="overlay" id="setup">
  <div class="modal">
    <h2>Ho ho go!</h2>
    <p>Pick your units and a distance range. Each door hides a run somewhere in that range.</p>
    <div class="seg" id="unitSeg">
      <button type="button" data-unit="km">Kilometres</button>
      <button type="button" data-unit="mi">Miles</button>
    </div>
    <div class="field">
      <label>Minimum<input type="number" id="minIn" min="0.5" step="0.5" inputmode="decimal"></label>
      <label>Maximum<input type="number" id="maxIn" min="0.5" step="0.5" inputmode="decimal"></label>
    </div>
    <div class="err" id="err"></div>
    <div class="actions">
      <button type="button" class="ghost" id="cancelBtn">Cancel</button>
      <button type="button" id="saveBtn">Let's run!</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const YEAR = 2026;
  const MONTH = 11; // December (0-indexed)
  const UNIT_LABEL = { km: 'km', mi: 'miles' };
  const SESSION_KEY = 'adventRun2026_doors';

  /* ---------- Cookie helpers (with localStorage fallback for file:// pages) ---------- */
  function setCookie(name, value, days = 365) {
    const exp = new Date(Date.now() + days * 864e5).toUTCString();
    document.cookie = `${name}=${encodeURIComponent(value)}; expires=${exp}; path=/; SameSite=Lax`;
    // Some browsers (e.g. Chrome opening a local file) block cookies, so mirror to localStorage
    if (getCookieRaw(name) === null) {
      try { localStorage.setItem('cookie_' + name, value); } catch (e) {}
    }
  }
  function getCookieRaw(name) {
    const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
    return m ? decodeURIComponent(m[1]) : null;
  }
  function getCookie(name) {
    const v = getCookieRaw(name);
    if (v !== null) return v;
    try { return localStorage.getItem('cookie_' + name); } catch (e) { return null; }
  }

  /* ---------- Settings ---------- */
  function loadSettings() {
    const unit = getCookie('advent_unit');
    const min = parseFloat(getCookie('advent_min'));
    const max = parseFloat(getCookie('advent_max'));
    if (!unit || isNaN(min) || isNaN(max)) return null;
    return { unit, min, max };
  }
  function saveSettings(s) {
    setCookie('advent_unit', s.unit);
    setCookie('advent_min', String(s.min));
    setCookie('advent_max', String(s.max));
  }

  /* ---------- Session (opened doors) ---------- */
  function loadDoors() {
    try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)) || {}; } catch (e) { return {}; }
  }
  function saveDoors(d) {
    try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(d)); } catch (e) {}
  }

  /* ---------- Date logic ---------- */
  function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function canOpen(day) {
    return today() >= new Date(YEAR, MONTH, day);
  }

  function randomDistance(min, max) {
    const step = 0.5;
    const steps = Math.floor((max - min) / step);
    return +(min + step * Math.floor(Math.random() * (steps + 1))).toFixed(1);
  }

  /* ---------- Layout ---------- */
  // Fixed shuffled order so doors look like a real advent calendar
  const ORDER = [7, 15, 2, 19, 11, 24, 4, 13, 21, 1, 9, 17, 6, 22, 3, 14, 10, 18, 5, 23, 12, 8, 20, 16];
  const ICONS = ['🎄','⛄','🎅','🦌','⭐','🔔','🎁','❄️','🍪','🧦'];

  const grid = document.getElementById('grid');
  let settings = loadSettings();
  let doors = loadDoors();

  function fmt(n) { return Number.isInteger(n) ? String(n) : n.toFixed(1); }

  function render() {
    grid.innerHTML = '';
    ORDER.forEach((day, i) => {
      const data = doors[day];
      const wrap = document.createElement('div');
      wrap.className = 'door-wrap';
      const unlocked = canOpen(day);
      const door = document.createElement('div');
      door.className = 'door' + (data ? ' open' : '') + (unlocked ? '' : ' locked');

      const back = document.createElement('div');
      back.className = 'door-back';
      if (data) {
        back.innerHTML = `<div class="ico">${ICONS[day % ICONS.length]}</div>
          <div class="dist">${fmt(data.distance)}</div>
          <div class="unit">${UNIT_LABEL[data.unit]}</div>
          <div class="dlabel">${day} December</div>`;
      }

      const front = document.createElement('div');
      front.className = 'door-front c' + (i % 4);
      front.innerHTML = `${day}${unlocked ? '' : '<span class="lock">🔒 ' + day + ' Dec</span>'}`;
      front.addEventListener('click', () => openDoor(day, door, back));

      door.append(back, front);
      wrap.appendChild(door);
      grid.appendChild(wrap);
    });
    renderHeader();
  }

  function openDoor(day, door, back) {
    if (!settings) { showSetup(); return; }
    if (!canOpen(day)) {
      door.classList.remove('shake'); void door.offsetWidth; door.classList.add('shake');
      toast(`No peeking! Door ${day} opens on ${day} December ${YEAR}.`);
      return;
    }
    if (doors[day]) return;
    const distance = randomDistance(settings.min, settings.max);
    doors[day] = { distance, unit: settings.unit };
    saveDoors(doors);
    back.innerHTML = `<div class="ico">${ICONS[day % ICONS.length]}</div>
      <div class="dist">${fmt(distance)}</div>
      <div class="unit">${UNIT_LABEL[settings.unit]}</div>
      <div class="dlabel">${day} December</div>`;
    requestAnimationFrame(() => door.classList.add('open'));
    renderHeader();
  }

  function renderHeader() {
    const chip = document.getElementById('rangeChip');
    chip.textContent = settings
      ? `Range: ${fmt(settings.min)}–${fmt(settings.max)} ${UNIT_LABEL[settings.unit]}`
      : 'No range set';

    const t = today();
    const xmas = new Date(YEAR, MONTH, 25);
    const days = Math.round((xmas - t) / 864e5);
    const cd = document.getElementById('countdown');
    if (days > 1) cd.textContent = `${days} sleeps until Christmas 🎄`;
    else if (days === 1) cd.textContent = `Christmas is tomorrow! 🎅`;
    else if (days === 0) cd.textContent = `Merry Christmas! 🎁`;
    else cd.textContent = `Hope you had a festive December of running!`;

    // Totals per unit
    const opened = Object.values(doors);
    const tot = { km: 0, mi: 0 };
    opened.forEach(d => tot[d.unit] += d.distance);
    const parts = Object.keys(tot).filter(u => tot[u] > 0).map(u => `<strong>${fmt(+tot[u].toFixed(1))} ${UNIT_LABEL[u]}</strong>`);
    document.getElementById('summary').innerHTML = opened.length
      ? `${opened.length} of 24 doors opened &middot; total so far ${parts.join(' + ')}`
      : `Open today's door to reveal your run.`;
  }

  /* ---------- Setup modal ---------- */
  const overlay = document.getElementById('setup');
  const minIn = document.getElementById('minIn');
  const maxIn = document.getElementById('maxIn');
  const err = document.getElementById('err');
  let chosenUnit = 'km';

  function setUnit(u) {
    chosenUnit = u;
    document.querySelectorAll('#unitSeg button').forEach(b => b.classList.toggle('active', b.dataset.unit === u));
  }
  document.querySelectorAll('#unitSeg button').forEach(b => b.addEventListener('click', () => setUnit(b.dataset.unit)));

  function showSetup() {
    setUnit(settings ? settings.unit : 'km');
    minIn.value = settings ? settings.min : 3;
    maxIn.value = settings ? settings.max : 10;
    err.textContent = '';
    document.getElementById('cancelBtn').style.display = settings ? '' : 'none';
    overlay.classList.add('show');
    minIn.focus();
  }

  document.getElementById('saveBtn').addEventListener('click', () => {
    const min = parseFloat(minIn.value), max = parseFloat(maxIn.value);
    if (isNaN(min) || isNaN(max)) { err.textContent = 'Please enter both distances.'; return; }
    if (min <= 0) { err.textContent = 'Minimum must be more than 0.'; return; }
    if (max < min) { err.textContent = 'Maximum must be at least the minimum.'; return; }
    if (max > 200) { err.textContent = 'Steady on, that is an ultra! Max 200.'; return; }
    settings = { unit: chosenUnit, min, max };
    saveSettings(settings);
    overlay.classList.remove('show');
    renderHeader();
  });
  document.getElementById('cancelBtn').addEventListener('click', () => overlay.classList.remove('show'));
  document.getElementById('settingsBtn').addEventListener('click', showSetup);

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  /* ---------- Snow ---------- */
  const c = document.getElementById('snow'), ctx = c.getContext('2d');
  let flakes = [];
  function resize() {
    c.width = innerWidth; c.height = innerHeight;
    flakes = Array.from({ length: Math.min(160, Math.floor(innerWidth / 8)) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 2.6 + .8, s: Math.random() * .8 + .3, w: Math.random() * Math.PI * 2
    }));
  }
  function tick() {
    ctx.clearRect(0, 0, c.width, c.height);
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    flakes.forEach(f => {
      f.y += f.s; f.w += .01; f.x += Math.sin(f.w) * .4;
      if (f.y > c.height) { f.y = -5; f.x = Math.random() * c.width; }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  addEventListener('resize', resize);
  resize(); tick();

  /* ---------- Init ---------- */
  render();
  if (!settings) showSetup();
})();
</script>
</body>
</html>
